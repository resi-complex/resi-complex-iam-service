spring.application.name=iam-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iam_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:resi_dev}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# OBLIGATORIO DEL DOCENTE:
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway:
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# IAM / JWT Configuration (1h access token, 7d refresh token per NFR-004 & ADR-006):
iam.jwt.secret=${JWT_SECRET:resicomplex-local-dev-hs256-signing-secret-key-at-least-256-bits-long-2026}
iam.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:3600}
iam.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
iam.security.max-failed-attempts=${IAM_MAX_FAILED_ATTEMPTS:5}
iam.security.lockout-minutes=${IAM_LOCKOUT_MINUTES:15}
